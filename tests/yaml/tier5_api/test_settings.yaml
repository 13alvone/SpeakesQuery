tests:
  # ── Read ───────────────────────────────────────────────────
  - id: api_settings_001
    title: "GET /api/settings - returns all settings"
    method: GET
    path: /api/settings
    expect:
      status_code: 200
      json_status: success
      has_keys: [settings]

  # ── Update validation ──────────────────────────────────────
  - id: api_settings_002
    title: "POST /api/settings - empty body returns 400"
    method: POST
    path: /api/settings
    body: {}
    expect:
      status_code: 400
      json_status: error
