tests:
  # ── Validation ─────────────────────────────────────────────
  - id: api_email_001
    title: "POST /api/email/test - missing recipient returns 400"
    method: POST
    path: /api/email/test
    body:
      to: ""
    expect:
      status_code: 400
      json_status: error

  - id: api_email_002
    title: "POST /api/email/test - missing body returns 400"
    method: POST
    path: /api/email/test
    body: {}
    expect:
      status_code: 400
      json_status: error
