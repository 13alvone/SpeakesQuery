tests:
  # ── List ───────────────────────────────────────────────────
  - id: api_jobs_001
    title: "GET /api/jobs - returns job list"
    method: GET
    path: /api/jobs
    expect:
      status_code: 200
      json_status: success
      has_keys: [jobs]

  # ── Not found ──────────────────────────────────────────────
  - id: api_jobs_002
    title: "GET /api/jobs/nonexistent_job_abc123 - returns 404"
    method: GET
    path: /api/jobs/nonexistent_job_abc123
    expect:
      status_code: 404
      json_status: error

  - id: api_jobs_003
    title: "DELETE /api/jobs/nonexistent_job_abc123 - returns 404"
    method: DELETE
    path: /api/jobs/nonexistent_job_abc123
    expect:
      status_code: 404
      json_status: error
