tests:
  # ── List ───────────────────────────────────────────────────
  - id: api_cred_001
    title: "GET /api/credentials/0 - returns key list for staging"
    method: GET
    path: /api/credentials/0
    expect:
      status_code: 200
      json_status: success
      has_keys: [keys]

  # ── Validation ─────────────────────────────────────────────
  - id: api_cred_002
    title: "POST /api/credentials/0 - missing key_name returns 400"
    method: POST
    path: /api/credentials/0
    body:
      value: "some_secret"
    expect:
      status_code: 400
      json_status: error

  - id: api_cred_003
    title: "POST /api/credentials/0 - missing value returns 400"
    method: POST
    path: /api/credentials/0
    body:
      key_name: "test_key"
    expect:
      status_code: 400
      json_status: error

  # ── Not found ──────────────────────────────────────────────
  - id: api_cred_004
    title: "DELETE /api/credentials/99998/nonexistent_key - returns 404"
    method: DELETE
    path: /api/credentials/99998/nonexistent_key
    expect:
      status_code: 404
      json_status: error
