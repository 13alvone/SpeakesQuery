tests:
  # ── inputlookup loads CSV ────────────────────────────────────
  # Fixture is generated by tests/generate_fixtures.py - 200 deterministic
  # Congress-shape rows, 11 columns. Pre-2026-05-06 the assertion was
  # min_rows: 55000 (against an unchecked-in real-data snapshot) and the
  # CSV file simply didn't exist locally → test failed silently with
  # "Query returned None" for ~weeks. Synthetic fixture + lower threshold
  # makes this hermetic.
  - id: inputlookup_001
    title: "inputlookup - load test.csv"
    query: |
      | inputlookup test.csv
    expect:
      min_rows: 200
      columns_include: ["url", "date", "congress", "title", "type", "kind", "policy", "_epoch"]

  # ── inputlookup column check ─────────────────────────────────
  - id: inputlookup_002
    title: "inputlookup - verify column count"
    query: |
      | inputlookup test.csv
    expect:
      column_count: 11
