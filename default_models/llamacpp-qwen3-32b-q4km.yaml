id: llamacpp-qwen3-32b-q4km
provider: lmstudio
model_name: Qwen_Qwen3-32B-Q4_K_M.gguf
description: |
  Qwen3 32B (Q4_K_M quantization) running on a dedicated llama.cpp
  server over the LAN. The "big local" tier in the cost-cascade
  pattern (see ROADMAP Bet 3) - frees the SpeakesQuery host from the
  ~20 GB VRAM footprint at the cost of a network round-trip.

  llama.cpp exposes an OpenAI-compatible Chat Completions API, so it
  uses the lmstudio provider transport (per CLAUDE.md: future similar
  self-hosted backends like vLLM / llama.cpp server reuse the same
  wire shape).

  REASONING MODEL - Qwen3 emits a `<think>...</think>` trace before
  its answer. max_output_tokens MUST stay >= 2000 to leave room for
  the actual answer after the trace; default 8192 here is comfortable.
  Generation ~11 tok/s on a single-GPU reference host; expect 30–90s
  wall clock for substantive responses. Use selectively for
  high-judgment background tasks (topic-cluster labeling, search-query
  synthesis from topic centroids); per-row triage stays on smaller
  models or claude-haiku.

  IMPORTANT - set `endpoint` to your llama.cpp host's URL before use.
  Default `http://localhost:8080/v1` only works when llama.cpp runs on
  the SAME machine as SpeakesQuery. For a dedicated remote box (the
  recommended setup), set `endpoint` to that machine's reachable URL
  on your LAN, e.g. `http://192.168.1.50:8080/v1`.

  No API key required by default. llama.cpp supports optional auth if
  you expose the server beyond a trusted network - wire that through
  the credential vault under `LMSTUDIO_API_KEY` (slice 2 router); the
  registry record itself doesn't carry secrets.
endpoint: http://localhost:8080/v1
cost_per_input_million_usd: 0.0
cost_per_output_million_usd: 0.0
max_output_tokens: 8192
default_timeout_seconds: 600
