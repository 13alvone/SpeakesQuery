<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" width="1160" height="320">
  <defs>
    <filter id="pencilTexture" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>

    <filter id="heavyRough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="3" seed="22" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="kraftGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="5" seed="11" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="multiply"/>
    </filter>

    <clipPath id="bubbleClip">
      <path d="
        M 120,28
        C 188,28  242,68  242,124
        C 242,180  188,222  120,222
        C 102,222  86,218  72,212
        L 38,242
        L 50,208
        C 28,192  10,166  10,140
        C 10,76  56,28  120,28
        Z
      "/>
    </clipPath>
  </defs>

  <!-- Kraft brown paper -->
  <rect width="1060" height="320" rx="8" fill="#C4A882"/>
  <rect width="1060" height="320" rx="8" fill="#BFA47A" filter="url(#kraftGrain)" opacity="0.5"/>

  <!-- ICON - heavy dark pencil rubbing -->
  <g filter="url(#heavyRough)">
    <path d="
      M 120,28
      C 188,28  242,68  242,124
      C 242,180  188,222  120,222
      C 102,222  86,218  72,212
      L 38,242
      L 50,208
      C 28,192  10,166  10,140
      C 10,76  56,28  120,28
      Z
    " fill="#1C1C1C" filter="url(#pencilTexture)" opacity="0.88"/>

    <g clip-path="url(#bubbleClip)">
      <rect x="44" y="50" width="48" height="6" rx="1" fill="#C4A882" opacity="0.05"/>
      <rect x="98" y="50" width="32" height="6" rx="1" fill="#C4A882" opacity="0.03"/>

      <rect x="44" y="66" width="56" height="6" rx="1" fill="#C4A882" opacity="0.08"/>
      <rect x="106" y="66" width="40" height="6" rx="1" fill="#C4A882" opacity="0.05"/>
      <rect x="152" y="66" width="30" height="6" rx="1" fill="#C4A882" opacity="0.05"/>

      <rect x="44" y="82" width="40" height="6" rx="1" fill="#C4A882" opacity="0.14"/>
      <rect x="90" y="82" width="54" height="6" rx="1" fill="#C4A882" opacity="0.08"/>
      <rect x="150" y="82" width="36" height="6" rx="1" fill="#C4A882" opacity="0.08"/>

      <rect x="44" y="98" width="62" height="6" rx="1" fill="#C4A882" opacity="0.22"/>
      <rect x="112" y="98" width="34" height="6" rx="1" fill="#C4A882" opacity="0.12"/>
      <rect x="152" y="98" width="48" height="6" rx="1" fill="#C4A882" opacity="0.12"/>

      <rect x="44" y="114" width="46" height="6" rx="1" fill="#C4A882" opacity="0.3"/>
      <rect x="96" y="114" width="56" height="6" rx="1" fill="#C4A882" opacity="0.17"/>
      <rect x="158" y="114" width="38" height="6" rx="1" fill="#C4A882" opacity="0.17"/>

      <rect x="44" y="130" width="54" height="6" rx="1" fill="#C4A882" opacity="0.4"/>
      <rect x="104" y="130" width="38" height="6" rx="1" fill="#C4A882" opacity="0.24"/>
      <rect x="148" y="130" width="50" height="6" rx="1" fill="#C4A882" opacity="0.24"/>

      <rect x="44" y="146" width="38" height="6" rx="1" fill="#C4A882" opacity="0.52"/>
      <rect x="88" y="146" width="50" height="6" rx="1" fill="#C4A882" opacity="0.32"/>
      <rect x="144" y="146" width="42" height="6" rx="1" fill="#C4A882" opacity="0.32"/>

      <rect x="44" y="164" width="58" height="6" rx="1" fill="#C4A882" opacity="0.68"/>
      <rect x="108" y="164" width="42" height="6" rx="1" fill="#C4A882" opacity="0.46"/>
      <rect x="156" y="164" width="52" height="6" rx="1" fill="#C4A882" opacity="0.46"/>

      <line x1="42" y1="178" x2="212" y2="178" stroke="#C4A882" stroke-width="0.5" opacity="0.15"/>
    </g>

    <text x="46" y="200" 
          font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" 
          font-size="18" font-weight="500"
          fill="#C4A882" opacity="0.42">&gt;_</text>

    <rect x="80" y="188" width="2.5" height="13" rx="1" fill="#C4A882" opacity="0.5"/>
  </g>

  <!-- WORDMARK - heavy dark graphite -->
  <g filter="url(#pencilTexture)" opacity="0.9">
    <text x="278" y="162" 
          font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="100" font-weight="700" letter-spacing="-3"
          fill="#1A1A1A">Speakes</text>

    <text x="682" y="162" 
          font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="100" font-weight="700" letter-spacing="2"
          fill="#1A1A1A">Query</text>
  </g>

  <!-- Tagline -->
  <g filter="url(#pencilTexture)" opacity="0.5">
    <text x="282" y="208" 
          font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" 
          font-size="14" font-weight="500"
          fill="#1A1A1A">&gt;</text>
    <text x="300" y="208" 
          font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="15" font-weight="500" letter-spacing="5"
          fill="#2C2C2C">LOCAL-FIRST DATA ENGINE</text>
  </g>
</svg>
