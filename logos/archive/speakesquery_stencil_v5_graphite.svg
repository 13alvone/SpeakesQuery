<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" width="1160" height="320">
  <defs>
    <filter id="pencilTexture" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="2" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>

    <filter id="roughEdge" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="4" seed="8" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="4" seed="5" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="multiply" result="grained"/>
    </filter>

    <filter id="pencilStroke">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feColorMatrix in="displaced" type="saturate" values="0" result="gray"/>
      <feBlend in="gray" in2="SourceGraphic" mode="multiply"/>
    </filter>

    <clipPath id="bubbleClip">
      <path d="
        M 120,18
        C 188,18  242,60  242,116
        C 242,172  188,214  120,214
        C 102,214  86,210  72,204
        L 38,232
        L 50,200
        C 28,184  10,158  10,132
        C 10,68  56,18  120,18
        Z
      "/>
    </clipPath>
  </defs>

  <!-- Warm cream paper background -->
  <rect width="1060" height="320" rx="8" fill="#FAF6F0"/>
  <rect width="1060" height="320" rx="8" fill="#FAF6F0" filter="url(#paperGrain)" opacity="0.4"/>

  <!-- ICON - pencil-rubbed bubble -->
  <g filter="url(#roughEdge)">
    <path d="
      M 120,28
      C 188,28  242,68  242,124
      C 242,180  188,222  120,222
      C 102,222  86,218  72,212
      L 38,242
      L 50,208
      C 28,192  10,166  10,140
      C 10,76  56,28  120,28
      Z
    " fill="#3C3C3C" filter="url(#pencilTexture)" opacity="0.82"/>

    <!-- Data rows as pencil strokes inside bubble -->
    <g clip-path="url(#bubbleClip)" filter="url(#pencilStroke)">
      <rect x="44" y="50" width="48" height="6" rx="1" fill="#FAF6F0" opacity="0.06"/>
      <rect x="98" y="50" width="32" height="6" rx="1" fill="#FAF6F0" opacity="0.04"/>

      <rect x="44" y="66" width="56" height="6" rx="1" fill="#FAF6F0" opacity="0.1"/>
      <rect x="106" y="66" width="40" height="6" rx="1" fill="#FAF6F0" opacity="0.06"/>
      <rect x="152" y="66" width="30" height="6" rx="1" fill="#FAF6F0" opacity="0.06"/>

      <rect x="44" y="82" width="40" height="6" rx="1" fill="#FAF6F0" opacity="0.16"/>
      <rect x="90" y="82" width="54" height="6" rx="1" fill="#FAF6F0" opacity="0.09"/>
      <rect x="150" y="82" width="36" height="6" rx="1" fill="#FAF6F0" opacity="0.09"/>

      <rect x="44" y="98" width="62" height="6" rx="1" fill="#FAF6F0" opacity="0.24"/>
      <rect x="112" y="98" width="34" height="6" rx="1" fill="#FAF6F0" opacity="0.14"/>
      <rect x="152" y="98" width="48" height="6" rx="1" fill="#FAF6F0" opacity="0.14"/>

      <rect x="44" y="114" width="46" height="6" rx="1" fill="#FAF6F0" opacity="0.32"/>
      <rect x="96" y="114" width="56" height="6" rx="1" fill="#FAF6F0" opacity="0.18"/>
      <rect x="158" y="114" width="38" height="6" rx="1" fill="#FAF6F0" opacity="0.18"/>

      <rect x="44" y="130" width="54" height="6" rx="1" fill="#FAF6F0" opacity="0.42"/>
      <rect x="104" y="130" width="38" height="6" rx="1" fill="#FAF6F0" opacity="0.26"/>
      <rect x="148" y="130" width="50" height="6" rx="1" fill="#FAF6F0" opacity="0.26"/>

      <rect x="44" y="146" width="38" height="6" rx="1" fill="#FAF6F0" opacity="0.52"/>
      <rect x="88" y="146" width="50" height="6" rx="1" fill="#FAF6F0" opacity="0.32"/>
      <rect x="144" y="146" width="42" height="6" rx="1" fill="#FAF6F0" opacity="0.32"/>

      <rect x="44" y="164" width="58" height="6" rx="1" fill="#FAF6F0" opacity="0.72"/>
      <rect x="108" y="164" width="42" height="6" rx="1" fill="#FAF6F0" opacity="0.5"/>
      <rect x="156" y="164" width="52" height="6" rx="1" fill="#FAF6F0" opacity="0.5"/>

      <line x1="42" y1="178" x2="212" y2="178" stroke="#FAF6F0" stroke-width="0.4" opacity="0.18"/>
    </g>

    <!-- >_ prompt rubbed through -->
    <text x="46" y="200" 
          font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" 
          font-size="18" font-weight="500"
          fill="#FAF6F0" opacity="0.5">&gt;_</text>

    <!-- Cursor -->
    <rect x="80" y="188" width="2.5" height="13" rx="1" fill="#FAF6F0" opacity="0.6"/>
  </g>

  <!-- WORDMARK - pencil rubbed text -->
  <g filter="url(#pencilTexture)" opacity="0.85">
    <text x="278" y="162" 
          font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="100" font-weight="700" letter-spacing="-3"
          fill="#2A2A2A">Speakes</text>

    <text x="682" y="162" 
          font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="100" font-weight="700" letter-spacing="2"
          fill="#3A3A3A">Query</text>
  </g>

  <!-- Tagline - lighter pencil pressure -->
  <g filter="url(#pencilTexture)" opacity="0.5">
    <text x="282" y="208" 
          font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" 
          font-size="14" font-weight="500"
          fill="#3C3C3C">&gt;</text>
    <text x="300" y="208" 
          font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="15" font-weight="500" letter-spacing="5"
          fill="#4A4A4A">LOCAL-FIRST DATA ENGINE</text>
  </g>
</svg>
