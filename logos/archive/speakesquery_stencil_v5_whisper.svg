<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" width="1160" height="320">
  <defs>
    <filter id="pencilTexture" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="31" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>

    <filter id="softEdge" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="3" seed="27" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="coldPress" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="5" seed="42" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="multiply"/>
    </filter>

    <clipPath id="bubbleClip">
      <path d="
        M 120,28
        C 188,28  242,68  242,124
        C 242,180  188,222  120,222
        C 102,222  86,218  72,212
        L 38,242
        L 50,208
        C 28,192  10,166  10,140
        C 10,76  56,28  120,28
        Z
      "/>
    </clipPath>
  </defs>

  <!-- Cold-pressed watercolor paper - cool off-white with visible tooth -->
  <rect width="1060" height="320" rx="8" fill="#F4F2EE"/>
  <rect width="1060" height="320" rx="8" fill="#EDE9E4" filter="url(#coldPress)" opacity="0.35"/>

  <!-- ICON - soft, ghostly rubbing in blue-gray -->
  <g filter="url(#softEdge)">
    <path d="
      M 120,28
      C 188,28  242,68  242,124
      C 242,180  188,222  120,222
      C 102,222  86,218  72,212
      L 38,242
      L 50,208
      C 28,192  10,166  10,140
      C 10,76  56,28  120,28
      Z
    " fill="#5A8AAE" filter="url(#pencilTexture)" opacity="0.42"/>

    <g clip-path="url(#bubbleClip)">
      <rect x="44" y="50" width="48" height="6" rx="1" fill="#F4F2EE" opacity="0.04"/>
      <rect x="98" y="50" width="32" height="6" rx="1" fill="#F4F2EE" opacity="0.02"/>

      <rect x="44" y="66" width="56" height="6" rx="1" fill="#F4F2EE" opacity="0.06"/>
      <rect x="106" y="66" width="40" height="6" rx="1" fill="#F4F2EE" opacity="0.04"/>
      <rect x="152" y="66" width="30" height="6" rx="1" fill="#F4F2EE" opacity="0.04"/>

      <rect x="44" y="82" width="40" height="6" rx="1" fill="#F4F2EE" opacity="0.1"/>
      <rect x="90" y="82" width="54" height="6" rx="1" fill="#F4F2EE" opacity="0.06"/>
      <rect x="150" y="82" width="36" height="6" rx="1" fill="#F4F2EE" opacity="0.06"/>

      <rect x="44" y="98" width="62" height="6" rx="1" fill="#F4F2EE" opacity="0.15"/>
      <rect x="112" y="98" width="34" height="6" rx="1" fill="#F4F2EE" opacity="0.09"/>
      <rect x="152" y="98" width="48" height="6" rx="1" fill="#F4F2EE" opacity="0.09"/>

      <rect x="44" y="114" width="46" height="6" rx="1" fill="#F4F2EE" opacity="0.2"/>
      <rect x="96" y="114" width="56" height="6" rx="1" fill="#F4F2EE" opacity="0.12"/>
      <rect x="158" y="114" width="38" height="6" rx="1" fill="#F4F2EE" opacity="0.12"/>

      <rect x="44" y="130" width="54" height="6" rx="1" fill="#F4F2EE" opacity="0.28"/>
      <rect x="104" y="130" width="38" height="6" rx="1" fill="#F4F2EE" opacity="0.16"/>
      <rect x="148" y="130" width="50" height="6" rx="1" fill="#F4F2EE" opacity="0.16"/>

      <rect x="44" y="146" width="38" height="6" rx="1" fill="#F4F2EE" opacity="0.36"/>
      <rect x="88" y="146" width="50" height="6" rx="1" fill="#F4F2EE" opacity="0.22"/>
      <rect x="144" y="146" width="42" height="6" rx="1" fill="#F4F2EE" opacity="0.22"/>

      <rect x="44" y="164" width="58" height="6" rx="1" fill="#F4F2EE" opacity="0.48"/>
      <rect x="108" y="164" width="42" height="6" rx="1" fill="#F4F2EE" opacity="0.32"/>
      <rect x="156" y="164" width="52" height="6" rx="1" fill="#F4F2EE" opacity="0.32"/>

      <line x1="42" y1="178" x2="212" y2="178" stroke="#F4F2EE" stroke-width="0.3" opacity="0.12"/>
    </g>

    <text x="46" y="200" 
          font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" 
          font-size="18" font-weight="500"
          fill="#F4F2EE" opacity="0.3">&gt;_</text>

    <rect x="80" y="188" width="2.5" height="13" rx="1" fill="#F4F2EE" opacity="0.35"/>
  </g>

  <!-- WORDMARK - soft blue-gray graphite -->
  <g filter="url(#pencilTexture)">
    <text x="278" y="162" 
          font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="100" font-weight="700" letter-spacing="-3"
          fill="#3A4E5E" opacity="0.55">Speakes</text>

    <text x="682" y="162" 
          font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="100" font-weight="700" letter-spacing="2"
          fill="#4A7A9E" opacity="0.5">Query</text>
  </g>

  <!-- Tagline - whisper-light -->
  <g filter="url(#pencilTexture)" opacity="0.32">
    <text x="282" y="208" 
          font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" 
          font-size="14" font-weight="500"
          fill="#4A7A9E">&gt;</text>
    <text x="300" y="208" 
          font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
          font-size="15" font-weight="500" letter-spacing="5"
          fill="#5A7080">LOCAL-FIRST DATA ENGINE</text>
  </g>
</svg>
