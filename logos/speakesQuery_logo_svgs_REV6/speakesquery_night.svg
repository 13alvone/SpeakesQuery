<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="940" height="210">

  <!-- THE MARK - very dark warm brown -->
  <rect x="16" y="16" width="170" height="178" rx="22" fill="#1C1208"/>

  <!-- Title bar - darkest warm -->
  <rect x="16" y="16" width="170" height="28" rx="22" fill="#140E06"/>
  <rect x="16" y="32" width="170" height="12" fill="#140E06"/>
  <circle cx="42" cy="30" r="3.5" fill="#CC4D40" opacity="0.7"/>
  <circle cx="56" cy="30" r="3.5" fill="#CC9520" opacity="0.7"/>
  <circle cx="70" cy="30" r="3.5" fill="#88802A" opacity="0.7"/>

  <!-- Data bars - amber/warm orange tones -->
  <rect x="38" y="56" width="88" height="7" rx="3" fill="#D4943C" opacity="0.18"/>
  <rect x="38" y="71" width="124" height="7" rx="3" fill="#E8A040" opacity="0.25"/>
  <rect x="38" y="86" width="66" height="7" rx="3" fill="#D4943C" opacity="0.34"/>
  <rect x="38" y="101" width="108" height="7" rx="3" fill="#E8A040" opacity="0.44"/>
  <rect x="38" y="116" width="78" height="7" rx="3" fill="#D4943C" opacity="0.54"/>
  <rect x="38" y="131" width="130" height="7" rx="3" fill="#ECAC48" opacity="0.68"/>
  <rect x="38" y="146" width="96" height="7" rx="3" fill="#F0B850" opacity="0.82"/>

  <!-- >_ prompt + cursor -->
  <text x="38" y="174" font-family="'SF Mono','Cascadia Code','Fira Code',monospace" font-size="13" font-weight="600" fill="#D49838" opacity="0.6">&gt;_</text>
  <rect x="62" y="164" width="2.5" height="12" rx="1" fill="#E8A840" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.8;0;0;0.8" keyTimes="0;0.45;0.5;0.95;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Wordmark - warm cream + burnt orange -->
  <text x="216" y="124"
        font-family="'Segoe UI','SF Pro Display','Helvetica Neue',sans-serif"
        font-size="90" font-weight="700" letter-spacing="-2"
        fill="#E8D4B0">Speakes</text>
  <text x="612" y="124"
        font-family="'Segoe UI','SF Pro Display','Helvetica Neue',sans-serif"
        font-size="90" font-weight="700" letter-spacing="1"
        fill="#D49030">Query</text>
</svg>
