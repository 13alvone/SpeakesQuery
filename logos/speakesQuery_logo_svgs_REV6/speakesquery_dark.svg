<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="940" height="210">

  <!-- THE MARK -->
  <rect x="16" y="16" width="170" height="178" rx="22" fill="#E8ECF0"/>

  <!-- Title bar -->
  <rect x="16" y="16" width="170" height="28" rx="22" fill="#D8DDE4"/>
  <rect x="16" y="32" width="170" height="12" fill="#D8DDE4"/>
  <circle cx="42" cy="30" r="3.5" fill="#FF5F57" opacity="0.85"/>
  <circle cx="56" cy="30" r="3.5" fill="#FEBC2E" opacity="0.85"/>
  <circle cx="70" cy="30" r="3.5" fill="#28C840" opacity="0.85"/>

  <!-- Data bars - dark tones on light background -->
  <rect x="38" y="56" width="88" height="7" rx="3" fill="#1A2B3C" opacity="0.15"/>
  <rect x="38" y="71" width="124" height="7" rx="3" fill="#2272B8" opacity="0.2"/>
  <rect x="38" y="86" width="66" height="7" rx="3" fill="#1A2B3C" opacity="0.28"/>
  <rect x="38" y="101" width="108" height="7" rx="3" fill="#2272B8" opacity="0.36"/>
  <rect x="38" y="116" width="78" height="7" rx="3" fill="#1A2B3C" opacity="0.46"/>
  <rect x="38" y="131" width="130" height="7" rx="3" fill="#2272B8" opacity="0.58"/>
  <rect x="38" y="146" width="96" height="7" rx="3" fill="#1A2B3C" opacity="0.72"/>

  <!-- >_ prompt + cursor -->
  <text x="38" y="174" font-family="'SF Mono','Cascadia Code','Fira Code',monospace" font-size="13" font-weight="600" fill="#2272B8" opacity="0.6">&gt;_</text>
  <rect x="62" y="164" width="2.5" height="12" rx="1" fill="#1A2B3C" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.8;0;0;0.8" keyTimes="0;0.45;0.5;0.95;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Wordmark - tightened gap -->
  <text x="216" y="124"
        font-family="'Segoe UI','SF Pro Display','Helvetica Neue',sans-serif"
        font-size="90" font-weight="700" letter-spacing="-2"
        fill="#E0E4E8">Speakes</text>
  <text x="612" y="124"
        font-family="'Segoe UI','SF Pro Display','Helvetica Neue',sans-serif"
        font-size="90" font-weight="700" letter-spacing="1"
        fill="#6AAEE0">Query</text>
</svg>
