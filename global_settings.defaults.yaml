# ── SpeakesQuery Global Settings (Defaults Reference) ──────────────
# This file is committed to the repo as a reference - it mirrors the
# DEFAULTS dict in global_settings.py. User overrides live in
# global_settings.yaml (gitignored). Keys below must stay in lock-step
# with the Python DEFAULTS; a drift test at tests/test_settings_ui_coverage.py
# guards the Settings UI against drift, but the .yaml below is reviewed by
# humans - keep them aligned when changing defaults.

# ── Indexes / Storage ──────────────────────────────────
indexes_root: "indexes"                  # relative to project root
max_total_size_gb: 200                   # total indexes/ cap before trimming
max_subdirectory_size_gb: 5              # per-subdirectory cap
max_parquet_file_mb: 128                 # target parquet file size for compaction

# ── Logs Index (SPQL-queryable log stream, separate budget) ──────
logs_root: "indexes/logs"                # parallel tree under indexes/logs/
max_logs_size_gb: 5                      # total logs/ cap before trimming (independent of indexes budget)
max_logs_subdirectory_size_gb: 2         # per-category log-subdir cap (1 GB floor)
logs_enabled: true                       # master switch for structured Parquet logging
logs_flush_interval_seconds: 30          # buffered log-writer flush cadence (5-600)

# ── Immutable Namespace (data that must survive forever) ─────────
# Wave 2 of Options Edge Brief (2026-04-26) - pick journal, closure
# events, performance review observations, future trading-record
# streams live here. Excluded from BOTH indexes/ and logs/ cleanup
# budgets so mtime-based eviction never deletes them. SPQL-queryable
# at indexes/IMMUTABLE/<subdir>/*.parquet. Writers should call
# settings.immutable_subdir(name).mkdir(parents=True, exist_ok=True)
# then write Parquet (atomic) into that path.
immutable_root: "indexes/IMMUTABLE"

# ── Trading Account Sizing (Wave 2 of OEB) ──────────────────────
# Drives the dual hit-rate compute in performance attribution.
# Picks where account_size_floor_usd <= this value count in
# hit_rate_account_fit; all picks count in hit_rate_overall.
# Grow this number as the account compounds over the decade horizon.
current_account_size_usd: 1000.0

# ── Maintenance Schedule ───────────────────────────────
cleanup_interval_hours: 6                # how often compaction + cleanup runs (floor: 1)

# ── Ingestion Defaults ─────────────────────────────────
default_script_timeout_seconds: 600      # max wall-clock time per ingestion script (bumped 2026-05-04 to give all scripts adequate runtime)
max_retries: 3                           # retry count for transient failures
http_request_timeout_seconds: 30         # timeout for HTTP requests inside scripts

# ── Per-Execution Resource Budgets ───────────────────
max_output_rows: 500000                  # max DataFrame rows written per execution (1K–10M)
max_requests_per_execution: 50           # max HTTP requests per script run (1–500)
max_response_size_mb: 10                 # max size per HTTP response body (1–100 MB)

# ── Subdirectory Limits ────────────────────────────────
max_subdirectory_depth: 5                # max nesting depth for output subdirectories (5-20)

# ── Credential Vault ──────────────────────────────────
credential_key_dir: "~/.speakes-query"     # directory for master.key (outside repo)

# ── Email / SMTP ─────────────────────────────────────
smtp_server: "smtp.gmail.com"            # SMTP relay hostname
smtp_port: 587                           # SMTP port (587 = STARTTLS, 465 = SSL)
smtp_user: ""                            # SMTP username (e.g. you@gmail.com)
smtp_password: ""                        # SMTP password or App Password
smtp_from: ""                            # From address (defaults to smtp_user if empty)
smtp_starttls: true                      # Use STARTTLS (true for port 587)

