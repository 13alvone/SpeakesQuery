# ── Headroom Compression Proxy (optional, self-hosted) ───────────
# Drop-in Anthropic endpoint that compresses request bodies to cut
# input-token cost. Alert-analysis Claude calls route through it when
# on; any connection-level failure fails open to direct Anthropic.
# Per-AG ``use_headroom`` (tri-state) overrides this global default.
# Default OFF - turn on only if you self-host a Headroom instance.
# Kill switch: set false here, or env HEADROOM_DISABLE=1. See
# analyzers/headroom.py + docs/lang/12_alert_groups.md.
global_use_headroom_default: false       # default OFF (enable if you run a Headroom proxy)
headroom_proxy_url: "http://localhost:8787"  # env HEADROOM_PROXY_URL overrides; empty → built-in default

# ── Claude Analyzer ──────────────────────────────────
claude_analyzer_enabled: false           # master switch - pipeline unchanged when false
claude_analyzer_boilerplate_prompt: ""   # system-level prompt sent with every analysis (optional)
claude_analyzer_model_primary: "claude-sonnet-4-6"       # for CRITICAL/HIGH alerts
claude_analyzer_model_triage: "claude-haiku-4-5-20251001" # for MODERATE/initial triage
# Per-call default output cap. Raised 2026-04-20 from 1024 after the
# first production Daily Opportunity Brief truncated at opportunity #1
# with output_tokens=1488. A 5-opportunity brief with web_search
# citations needs 8192+; individual alert groups can override higher
# via the per-AG ``max_output_tokens`` field (ceiling 32768).
claude_analyzer_max_output_tokens: 8192
claude_analyzer_max_input_rows: 20       # truncate result sets beyond this for API call
claude_analyzer_enable_cache: true       # prompt caching (cache_control ephemeral)
claude_analyzer_enable_batch: false      # batch API (async, 50% off)
claude_analyzer_daily_budget_cents: 50   # kill switch: stop calling API if daily spend exceeds this
claude_analyzer_spike_threshold: 10.0    # spike_multiple above this → use primary model
claude_analyzer_min_liquidity: 5000.0    # skip markets below this liquidity
claude_analyzer_mv_truncate_limit: 5     # max distinct values shown per token before truncation
claude_analyzer_batch_poll_interval_minutes: 5  # how often the batch poller checks for results (1-60)

# ── Claude API robustness + accounting ────────────────
# Raised 2026-04-21 from 120s after the first live Daily Opportunity
# Brief timed out: web_search-enabled briefs legitimately take 2-5
# minutes. At 120s every attempt hit the wall and the retry loop burned
# 8 minutes hitting the same ceiling. Ceiling is 3600s for future
# heavier briefs. APITimeoutError is intentionally NOT retried (see
# analyzers/claude_client.py::_is_retryable): retrying a timeout fires
# another attempt against the same wall. Raise THIS setting, not retries.
claude_request_timeout_seconds: 600
claude_retry_attempts: 3                 # only applies to 429 / 5xx / connection errors (NOT timeouts)
claude_retry_initial_backoff_seconds: 2  # exponential backoff base
# Full request+response retention for every Claude call in
# claude_api_history.sqlite (lives OUTSIDE indexes/ so cleanup never
# touches it). Set false only if disk is tight - user is the keeper.
claude_history_retain_payloads: true

# ── Alert group observability / failure alerts ────────
alert_group_failure_email_enabled: true  # notify admin when an AG dispatch status=error
alert_group_failure_email_to: ""         # recipient; falls back to smtp_from, then smtp_user

# ── Alert group production hardening (2026-04-20+) ────
alert_group_max_feeder_staleness_hours: 48  # per-AG override wins; "dead feeder" threshold
alert_group_fail_on_stale_feeder: false     # if true, a stale feeder fails the AG instead of warning
# Circuit breaker: after N consecutive error runs, auto-disable the AG
# via ``circuit_breaker_tripped: true`` on the YAML. Reset via POST
# /api/alert-groups/<name>/reset-circuit-breaker after investigating.
alert_group_circuit_breaker_consecutive_failures: 5
alert_group_circuit_breaker_auto_disable: true
# Half-open circuit breaker (2026-08-04): a tripped AG skips CLEANLY (no
# failure email, no error streak) during the cooldown, then auto-probes
# one real dispatch. Success closes the breaker; failure restarts the
# cooldown. Manual reset still works and always wins.
alert_group_circuit_breaker_cooldown_hours: 20
# Cap on the server-side web_search loop inside an AG's Claude call.
# The first uncapped Opus 5 run issued enough searches to balloon input
# to 716k tokens ($4.02/run) - each server-side iteration re-bills the
# growing context. Paired with the prompt-cache breakpoint the
# dispatcher now sets on the built prompt (iterations re-read at ~0.1x).
alert_group_web_search_max_uses: 8
# Note on max_dispatches_per_day (per-AG field): since 2026-08-04 the
# cap counts successes per CALENDAR DAY in the AG's timezone, not a
# rolling 24h window (rolling windows measured from completion-stamped
# rows dropped every other daily dispatch). Pair with the per-AG
# min_interval_between_runs_hours field when wall-clock spacing between
# consecutive dispatches also matters.
# Graduated retry for local (router) LLM calls in AG dispatch: total
# attempts and base backoff delay (delay triples per retry, capped at
# 10 min). Local calls are $0 so retries cost only wall-clock.
local_llm_retry_attempts: 3
local_llm_retry_base_delay_seconds: 30
# When the LLM call still fails after all retries, email the fully built
# prompt to the AG's recipient so the day's feeder data is not lost
# (prompt_only-style salvage email; run still records status=error).
alert_group_llm_failure_prompt_fallback: true
# Output-token cap for the optional per-AG email digest pass
# (email_digest_model_id): distills the raw analyst output into a
# BLUF-first email body via a local model. Keep >= 8192 for thinking
# models: the reasoning trace counts against max_tokens and a starved
# trace returns empty content (the 122B failure mode).
alert_group_digest_max_tokens: 8192
# Cap on saved-search feeders per alert group. Allowed range 2-100; default
# 10 preserves the pre-2026-04-21 limit. Raise for wider multi-sector briefs.
alert_group_max_feeders: 10

# ── SEC fair-access fallback ──────────────────────────
# EDGAR requires a User-Agent identifying a contact. This default fires
# only when the per-task ``SEC_EDGAR_CONTACT`` credential is missing -
# otherwise the script's own contact string wins. Kind=="contact" is a
# non-secret identifier, hence the silent fallback is acceptable (see
# reference_silent_credential_fallback_antipattern memory).
sec_edgar_contact_default: "SpeakesQuery EDGAR (noreply@speakesquery.local)"

# ── Semantic Search (Phase 1 / Bet 2) ─────────────────
# Master switch for the embedding subsystem. When false, the sweeper
# does not run; existing | nearest / | dedup_semantic queries still
# work - they embed on the fly per call. Default off so existing
# deployments don't suddenly start populating ~80 MB of model + N×1.5KB
# of sidecar parquet without explicit operator opt-in.
embeddings_enabled: false
# Cap on the embedding-sidecar tree (sum of all *.embeddings.parquet
# under indexes/). Independent of max_total_size_gb so a runaway
# sweeper can never evict actual indexed data. ~3M rows fit in 5GB
# at 384 dims/float32. Range: 1-1000 GB.
max_embeddings_size_gb: 5
# HuggingFace model identifier. Default all-MiniLM-L6-v2 is small
# (~80 MB), MIT-licensed, CPU-friendly, 384 dims. BGE-base / Nomic
# (768 dims, ~270-440 MB) are higher-recall alternatives. Changing
# this triggers a full re-embed on next sweep - sidecar metadata
# carries the model name for drift detection.
embedding_model_name: "sentence-transformers/all-MiniLM-L6-v2"
# Batch size for SentenceTransformer.encode(). 32 is CPU-friendly;
# bump to 128+ on a beefy GPU. Range: 1-1024.
embedding_batch_size: 32
# How often the embedding sweeper runs (minutes). Floor 1, ceiling
# 1440 (one day). Default 15 min keeps fresh ingestion lag low.
embedding_sweep_interval_minutes: 15

# ── Notebook reactive cache (Phase 3 / Bet 4 - slice 3) ─────────────
# Master switch for cell-output caching. When True (default), notebook
# cells are content-hash keyed; unchanged inputs serve from disk for
# free. Off = every cell re-runs every time.
notebook_cache_enabled: true
# Total disk budget for the cache (sum of pickle payloads under
# notebook_cache/). LRU eviction at the budget boundary. Range 0.1 -
# 100.0 GB. Default 1.0 GB.
max_notebook_cache_gb: 1.0

# ── LLM Pipes (Phase 2 / Bet 3 - slice 7) ───────────────────────────
# Hard ceiling on cumulative cost (USD) for any | llm / | llm_batch
# invocation that doesn't pass an inline max_cost_usd= kwarg.
# 0.0 means no cap (unlimited). The in-pipe kwarg ALWAYS wins over
# this default. Range 0.0 - 1000.0.
llm_default_max_cost_usd: 0.0
# UI threshold for the "expensive query" warning banner. The SPA
# displays a warning when a dry-run estimate exceeds this value.
# Backend doesn't enforce. 0.0 disables the warning entirely.
# Range 0.0 - 1000.0.
llm_warn_above_estimated_usd: 1.0

# ── Patch drafter (Phase 4 / Bet 4 slice 8a) ────────────────────────
# When True, an ingestion task failure triggers a Claude call that
# asks for a unified-diff fix. The diff is RECORDED to the
# patch_suggestions log (queryable via SPQL) for the operator to
# review + apply manually. NEVER auto-applied. Default OFF - opt-in
# for cost safety. Slice 8b will add GitHub PR creation on top.
patch_drafter_enabled: false
# Claude model for the patch drafter. Haiku is the default - small,
# fast, cheap, code-aware. Switch to Sonnet for higher-quality diffs
# at higher cost.
patch_drafter_model: "claude-haiku-4-5-20251001"
# Per-call hard cost ceiling (USD). Worst-case-cost-exceeds-this →
# call skipped with status="skipped_budget" and no network call.
# 0.0 = uncapped (NOT recommended). Range 0.0 - 1000.0.
patch_drafter_max_cost_usd: 0.10
# Per-call timeout (seconds). The drafter is a single-shot diff
# request; 60s is generous for Haiku.
patch_drafter_timeout_seconds: 60
