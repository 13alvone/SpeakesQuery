[pytest]
# Default run skips network-dependent tests. They are opt-in via explicit -m flags
# because they hit real APIs, require secrets, and fail on flaky endpoints - behaviour
# unsuitable for the "zero failures is the production bar" standard on the default run.
#   pytest                              → default run (skips smoke + live_integration)
#   pytest -m smoke                     → live API smoke tests only (network required)
#   pytest -m live_integration          → full end-to-end (secrets.txt required)
#   pytest -m ""                        → run absolutely everything (old default; mostly for CI matrix)
addopts = -m "not smoke and not live_integration"
markers =
    smoke: live API smoke tests (require network access, run with: pytest -m smoke)
    live_integration: full end-to-end tests against real APIs + SMTP + Claude; require secrets.txt at project root (run with: pytest -m live_integration)
