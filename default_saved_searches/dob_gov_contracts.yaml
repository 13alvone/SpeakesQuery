name: dob_gov_contracts
description: |
  Alert-group feed: MEGA (>$100M) and VERY_LARGE (>$50M) federal contract
  awards from the last 7 days.  A large DoD contract awarded to a small-cap
  company is a 2-5x re-pricing event.  Capped at 10.
query: |-
  index="indexes/government/contract_awards/*.parquet"
  | where size_tier IN ("MEGA","VERY_LARGE")
  | sort -amount_millions
  | table recipient, amount_millions, awarding_agency, awarding_sub_agency, contract_type, description, start_date, end_date, size_tier
  | head 10
cron_schedule: 30 5,11 * * mon-fri
lookback: -48h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-16T00:00:00"
updated_at: "2026-04-16T00:00:00"
