name: spbeb_injuries
description: |
  Alert-group feed: high-severity active injuries for the four major US
  leagues (NFL, NBA, MLB, NHL). Reuses indexes/sports/injuries parquet
  emitted by espn_injuries_feed. Filtered to severity_rank >= 3 (any
  status worse than Probable). Powers the Sports Betting Edge Brief's
  injury context block - late-breaking star-player news drives most of
  the high-edge pre-game line moves.
query: |-
  index="indexes/sports/injuries/*.parquet"
  | sort -_epoch
  | dedup athlete_id
  | where severity_rank >= 3
  | sort -severity_rank, -date_reported_epoch
  | table league, team_abbr, athlete_name, position, status, injury_type, short_comment, date_reported
  | head 30
cron_schedule: 0 13,15 * * *
lookback: -48h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-24T00:00:00"
updated_at: "2026-04-24T00:00:00"
