name: egib_electricity_demand
description: |
  Alert-group feed: daily electricity demand for the major US balancing
  authorities (CAL, CAR, FLA, MIDA, MIDW, NE, NY, NW, SE, SW, TEN, TEX).
  Reuses indexes/energy/eia_electricity_demand parquet emitted by
  eia_electricity_demand. Filtered to elevated / peak / soft / trough
  regions for actionable signal.

  Round-6 (2026-05-02): the EIA ingestion now emits a sentinel row with
  regime_flag=API_ERROR when the script fails to produce real rows
  (auth issue, EIA format change, rate-limit throttle). SPQL filters
  the sentinel OUT of the row stream but exposes its count as
  `n_api_error_days` cohort tally - Claude sees real signal regions
  plus a tally of upstream API health.
query: |-
  index="indexes/energy/eia_electricity_demand/*.parquet"
  | sort -_epoch
  | dedup region
  | eval api_err_indicator=if_(regime_flag=="API_ERROR", 1, 0)
  | eventstats sum(api_err_indicator) as n_api_error_days
  | where regime_flag IN ("PEAK","ELEVATED","SOFT","TROUGH")
  | sort -percentile_90d
  | table region, region_name, latest_demand_mwh, change_dod_pct, change_wow_pct, percentile_90d, regime_flag, investment_thesis, period, n_api_error_days
  | head 13
cron_schedule: 0 14 * * mon-fri
lookback: -2d
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-24T00:00:00"
updated_at: "2026-05-02T02:35:00"
