name: cdsb_stablecoin_flows
description: |
  Alert-group feed: stablecoin supply by issuer (USDT / USDC / DAI / etc.)
  with peg deviation and chain distribution. Reuses the existing
  indexes/crypto/defillama_stablecoins parquet. Stablecoin supply is the
  single best leading indicator for crypto markets - rising supply means
  fresh capital is staging to deploy; falling supply means exit. Powers
  the Crypto Deep Signals Brief's regime-context block.
query: |-
  index="indexes/crypto/defillama_stablecoins/*.parquet"
  | sort -_epoch
  | dedup symbol
  | where circulating_usd >= 100000000
  | sort -circulating_usd
  | table symbol, name, peg_type, peg_mechanism, circulating_usd, market_share_pct, price, peg_deviation_pct, is_depegged, chain_count
  | head 12
cron_schedule: 0 1 * * *
lookback: -36h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
