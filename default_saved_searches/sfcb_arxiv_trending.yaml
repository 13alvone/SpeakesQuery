name: sfcb_arxiv_trending
description: |
  Alert-group feed: recent arXiv papers across the most market-relevant
  quant categories (cs.AI, cs.LG, cs.CL, cs.CR, cs.NE, q-fin.*, q-bio.*,
  stat.ML). Reuses indexes/research/arxiv_papers parquet emitted by
  arxiv_recent_papers. Powers the Science & Forecasting Community Brief:
  novel research signals capability shifts that move themed equities
  (NVDA / SOXX on AI papers; BIIB / VRTX on q-bio; algo trading firms
  on q-fin papers).
query: |-
  index="indexes/research/arxiv_papers/*.parquet"
  | sort -_epoch
  | dedup arxiv_id
  | sort -updated_date
  | table arxiv_id, title, abstract, primary_category, all_categories, author_count, first_author, published_date, updated_date, page_url
  | head 25
cron_schedule: 0 4 * * *
lookback: -2d
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
