name: rcpb_kalshi_religion
description: |
  Alert-group feed: Kalshi religion / cultural-event contracts (papal,
  Catholic Church leadership, religious-event timing, cultural milestones).
  Reuses indexes/kalshi_contracts parquet via eval-then-where filter.
  Capped to contracts closing within 365 days. Religion contracts on
  Kalshi are sparse - empty-DF short-circuit handles thin weeks. Powers
  the Religion & Cultural Prediction Brief's prediction-market block.
query: |-
  index="indexes/kalshi_contracts/*.parquet"
  | sort -_epoch
  | dedup market_ticker
  | eval is_religion = if_(match(market_title, "(?i)Pope"), 1, if_(match(market_title, "(?i)Vatican"), 1, if_(match(market_title, "(?i)papal"), 1, if_(match(market_title, "(?i)conclave"), 1, if_(match(market_title, "(?i)Dalai Lama"), 1, if_(match(market_title, "(?i)Hajj"), 1, if_(match(market_title, "(?i)Mecca"), 1, if_(match(market_title, "(?i)religious"), 1, if_(match(market_title, "(?i)church"), 1, if_(match(market_title, "(?i)Easter"), 1, if_(match(market_title, "(?i)Christmas"), 1, if_(match(market_title, "(?i)Diwali"), 1, 0))))))))))))
  | where is_religion = 1
  | where days_to_close > 0
  | where days_to_close <= 365
  | sort -volume
  | table event_title, market_title, category, yes_price, implied_prob_yes, volume, open_interest, days_to_close
  | head 15
cron_schedule: 0 17 * * sun
lookback: -8d
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
