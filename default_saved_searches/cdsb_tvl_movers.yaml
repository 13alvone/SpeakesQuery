name: cdsb_tvl_movers
description: |
  Alert-group feed: top DeFi protocol TVL movers (24h / 7d / 30d) ranked by
  largest absolute USD swings. Reuses the existing indexes/crypto/
  defillama_tvl_movers parquet. TVL inflows/outflows lead protocol-token
  performance by 1-3 days; concentrated outflows from a single protocol
  signal contagion risk. Powers the Crypto Deep Signals Brief's protocol
  flows block.
query: |-
  index="indexes/crypto/defillama_tvl_movers/*.parquet"
  | sort -_epoch
  | dedup protocol
  | where tvl_usd >= 50000000
  | sort -change_1d_pct
  | table protocol, symbol, category, tvl_usd, dollar_flow_1d, change_1d_pct, change_7d_pct, change_30d_pct, alert_level, chains, mcap_usd
  | head 20
cron_schedule: 0 1 * * *
lookback: -36h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
