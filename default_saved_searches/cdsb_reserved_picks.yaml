name: cdsb_reserved_picks
description: |
  Feeder for the Crypto Deep Signals Brief dedup / throttle loop. Returns
  every pick written to indexes/IMMUTABLE/ag_picks/ in the last 24 hours for
  the crypto_deep_signals_brief alert group. The dispatcher injects these
  as a RESERVED IDEAS block so Claude doesn't re-suggest the same crypto
  trade two days in a row unless a material new catalyst (depeg event,
  TVL outflow >10%, exchange flow regime shift, regulatory action) has
  emerged. Capped at 25.
query: |-
  index="indexes/IMMUTABLE/ag_picks/*.parquet"
  | where alert_group="crypto_deep_signals_brief"
  | eval ago_24h = now() - 86400
  | where _epoch >= ago_24h
  | sort -_epoch, rank_in_brief
  | table idea_id, rank_in_brief, pick_tier, direction, conviction_pct, correlation_cluster, thesis, event_timestamp
  | head 25
cron_schedule: ""
lookback: -24h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
