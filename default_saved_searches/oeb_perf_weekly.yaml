name: oeb_perf_weekly
description: |
  Performance Review feeder: closures in the past 7 days.  One row per
  pick that hit a stop / take / time / expiration trigger in the window,
  with outcome, signed P&L per 1 contract, % vs max loss, days held,
  closure quality, and account-fit flag.  Capped at 50.
query: |-
  index="indexes/IMMUTABLE/ag_picks_closures/*.parquet"
  | where alert_group="options_edge_brief"
  | eval ago_7d = now() - 604800
  | where _epoch >= ago_7d
  | table idea_id, instrument_id, outcome, trigger_rule, entry_price, exit_price, pnl_per_contract_usd, pnl_pct_vs_max_loss, days_held, closure_quality, fits_account_at_entry, fits_account_at_close, exit_epoch
  | sort -exit_epoch
  | head 50
cron_schedule: 0 22 * * sun
lookback: -8d
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-26T00:00:00"
updated_at: "2026-04-26T00:00:00"
