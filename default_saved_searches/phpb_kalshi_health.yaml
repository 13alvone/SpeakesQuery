name: phpb_kalshi_health
description: |
  Alert-group feed: Kalshi health / FDA / pharma / pandemic / vaccine
  contracts. Reuses indexes/kalshi_contracts parquet via eval-then-where
  filter. Capped to contracts closing within 90 days. Powers the Public
  Health & Pharma Catalyst Brief's prediction-market block - health
  prediction markets often lead news cycles on drug approvals, FDA
  actions, and disease-outbreak forecasts.
query: |-
  index="indexes/kalshi_contracts/*.parquet"
  | sort -_epoch
  | dedup market_ticker
  | eval is_health = if_(match(category, "(?i)health"), 1, if_(match(market_title, "(?i)FDA"), 1, if_(match(market_title, "(?i)drug approval"), 1, if_(match(market_title, "(?i)vaccine"), 1, if_(match(market_title, "(?i)pandemic"), 1, if_(match(market_title, "(?i)flu cases"), 1, if_(match(market_title, "(?i)COVID"), 1, if_(match(market_title, "(?i)Medicare"), 1, if_(match(market_title, "(?i)pharma"), 1, if_(match(market_title, "(?i)biotech"), 1, if_(match(market_title, "(?i)Alzheimer"), 1, if_(match(market_title, "(?i)cancer"), 1, 0))))))))))))
  | where is_health = 1
  | where days_to_close > 0
  | where days_to_close <= 90
  | sort -volume
  | table event_title, market_title, category, yes_price, implied_prob_yes, volume, open_interest, days_to_close
  | head 20
cron_schedule: 0 3 * * mon-fri
lookback: -48h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
