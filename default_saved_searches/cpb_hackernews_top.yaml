name: cpb_hackernews_top
description: |
  Alert-group feed: top Hacker News stories from past 7 days, ranked by
  score. Reuses existing indexes/hackernews/top_stories parquet emitted
  by hackernews_top_stories. Powers the Civilization Pulse Brief's tech-
  / startup- / engineering-attention block - what is the technical class
  paying attention to this week.
query: |-
  index="indexes/hackernews/top_stories/*.parquet"
  | sort -_epoch
  | dedup story_id
  | where score >= 100
  | sort -score
  | table story_id, title, url, author, score, comment_count, type
  | head 25
cron_schedule: 30 11 * * sun
lookback: -8d
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
