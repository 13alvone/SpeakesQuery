name: cdsb_market_dominance
description: |
  Alert-group feed: top-N coin market dominance and BTC-dominance regime
  flag. Reuses indexes/crypto/coingecko_dominance parquet. BTC dominance
  rising during broad selloff = flight to safety within crypto; BTC
  dominance falling during rally = altseason signal. Powers the Crypto
  Deep Signals Brief's regime block - pairs with stablecoin flows for the
  capital-flow narrative.
query: |-
  index="indexes/crypto/coingecko_dominance/*.parquet"
  | sort -_epoch
  | dedup symbol
  | sort -dominance_pct
  | table metric, symbol, dominance_pct, total_market_cap_usd, defi_dominance, active_cryptocurrencies, markets
  | head 12
cron_schedule: 0 1 * * *
lookback: -36h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
