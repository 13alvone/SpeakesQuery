name: oeb_perf_open_positions
description: |
  Performance Review feeder: every OEB pick from the past 30 days with
  its source signals + structure metadata.  Claude joins this against
  oeb_perf_weekly / oeb_perf_monthly to identify still-open positions
  and reason about the in-flight book.  Capped at 100.
query: |-
  index="indexes/IMMUTABLE/ag_picks/*.parquet"
  | where alert_group="options_edge_brief"
  | eval ago_30d = now() - 2592000
  | where _epoch >= ago_30d
  | table idea_id, instrument_id, direction, conviction_pct, expected_return_pct, entry_price, suggested_buy_epoch, suggested_sell_epoch, hold_hours, take_profit_price, stop_loss_price, exit_catalyst, source_signals, correlation_cluster, option_structure, option_max_loss_usd, option_max_profit_usd, option_dte_days, account_size_floor_usd
  | sort -_epoch
  | head 100
cron_schedule: 0 22 * * sun
lookback: -31d
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-26T00:00:00"
updated_at: "2026-04-26T00:00:00"
