name: cdsb_yield_opportunities
description: |
  Alert-group feed: top DeFi yield opportunities by APY across stablecoin
  + ETH + BTC pools, filtered to high TVL and low impermanent-loss risk.
  Reuses indexes/crypto/defillama_yields parquet. Outsized stablecoin
  yields above ~10% indicate elevated demand for borrow / leverage on the
  underlying chain - bullish for that ecosystem. Sustained 30-50% yield on
  stablecoin pools often precedes a depeg event. Powers the Crypto Deep
  Signals Brief's yield-context block.
query: |-
  index="indexes/crypto/defillama_yields/*.parquet"
  | sort -_epoch
  | dedup pool_id
  | where tvl_usd >= 5000000
  | where apy_total >= 4.0
  | sort -apy_total
  | table project, chain, symbol, tvl_usd, apy_total, apy_base, apy_reward, apy_7d_avg, sustainability_pct, is_stablecoin, il_risk, exposure, tier
  | head 20
cron_schedule: 0 1 * * *
lookback: -36h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
