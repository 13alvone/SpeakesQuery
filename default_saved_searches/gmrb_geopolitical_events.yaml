name: gmrb_geopolitical_events
description: |
  Alert-group feed: GDELT 2.0 article-level headlines classified into
  durable conflict/tension themes (RUSSIA_UKRAINE_WAR, TAIWAN_STRAIT_TENSION,
  MIDDLE_EAST_CONFLICT, IRAN_TENSION, KOREAN_PENINSULA, SOUTH_CHINA_SEA,
  INDIA_PAKISTAN, VENEZUELA_GUYANA, NATO_RUSSIA, SANCTIONS_ACTIVITY).
  Headlines returned sorted by theme then recency; row density per theme
  IS the tension signal. Unclassified headlines are filtered out upstream
  to keep the brief context-focused.

  Round-6 (2026-05-02): the GDELT ingestion now emits sentinel rows
  with tension_theme=API_ERROR (HTTP failure) or NO_SIGNAL (200 with
  no theme matches) so silent-empty days are distinguishable from
  feeder-broken days. SPQL filters sentinels OUT of the row stream
  but exposes their count as `n_api_errors` + `n_no_signal_days`
  cohort tallies - Claude sees real headlines plus a tally of how
  often the upstream API was returning nothing during the lookback.
query: |-
  index="indexes/geopolitics/gdelt_events/*.parquet"
  | sort -_epoch
  | dedup article_url
  | eval api_err_indicator=if_(tension_theme=="API_ERROR", 1, 0), no_signal_indicator=if_(tension_theme=="NO_SIGNAL", 1, 0)
  | eventstats sum(api_err_indicator) as n_api_errors, sum(no_signal_indicator) as n_no_signal_days
  | where tension_theme != "API_ERROR" AND tension_theme != "NO_SIGNAL"
  | sort +tension_theme, -_epoch
  | table tension_theme, severity_tier, title, source_country, investment_thesis, seen_date, article_url, n_api_errors, n_no_signal_days
  | head 25
cron_schedule: 0 7,13 * * mon-fri
lookback: -48h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-22T00:00:00"
updated_at: "2026-05-02T01:25:00"
