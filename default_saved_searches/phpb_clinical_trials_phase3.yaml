name: phpb_clinical_trials_phase3
description: |
  Alert-group feed: Phase 3 (and Phase 2/3) clinical trial status updates
  from the past 30 days, filtered to industry-sponsored trials with HIGH
  or MEDIUM market impact. Reuses indexes/clinical_trials/phase3_updates
  parquet emitted by clinicaltrials_phase3_updates. Powers the Public
  Health & Pharma Catalyst Brief's pipeline block - Phase 3 readouts move
  biotech / pharma equities 30-300% on success and 50-90% on failure.
query: |-
  index="indexes/clinical_trials/phase3_updates/*.parquet"
  | sort -_epoch
  | dedup nct_id
  | where impact_tier IN ("HIGH","MEDIUM")
  | sort -last_update_post_date
  | table nct_id, brief_title, condition, intervention, lead_sponsor, lead_sponsor_class, overall_status, phase, enrollment, primary_completion_date, last_update_post_date, impact_tier
  | head 25
cron_schedule: 0 3 * * mon-fri
lookback: -7d
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
