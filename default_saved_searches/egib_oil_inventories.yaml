name: egib_oil_inventories
description: |
  Alert-group feed: weekly US petroleum stocks (commercial crude, SPR,
  Cushing OK, gasoline, distillate) plus refinery utilisation and
  gasoline demand. Reuses indexes/energy/eia_petroleum parquet emitted
  by eia_petroleum_stocks. EIA WPSR is the highest-impact weekly oil
  data release (Wed 10:30 ET). Powers the Energy & Grid Intelligence
  Brief's oil block.
query: |-
  index="indexes/energy/eia_petroleum/*.parquet"
  | sort -_epoch
  | dedup series_id
  | sort +category
  | table series_id, description, category, latest_value, prior_value, change_wow_pct, change_yoy_pct, percentile_5y, regime_flag, investment_thesis, etf_ticker, period
  | head 10
cron_schedule: 0 14 * * mon-fri
lookback: -8d
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-24T00:00:00"
updated_at: "2026-04-24T00:00:00"
