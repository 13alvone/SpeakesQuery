name: curator_scored_candidates_today
description: |
  Phase 6 / Bet 5 slice 2 (2026-05-16, hotfixed 2026-05-17 for slice 3b
  compatibility). Feeder for the curator playlist composer AG. Reads
  the candidate pool - populated by curator_youtube_rss_pull (channels
  the user subscribes to) AND curator_topic_search_pull_pro (channels
  discovered via topic-cluster search, slice 3b). Joins with the
  user's watch_history from the Google Takeout bootstrap, and scores
  each candidate on three axes:

    interest_score (0.0-1.0): preliminary score based on the user's
                              all-time watch count for the channel
                              (normalized). For candidates from
                              channels the user has NEVER watched
                              (slice 3b output), this is 0.0
                              preliminarily; the AG dispatcher's
                              slice-3a topic-scoring hook OVERWRITES
                              interest_score with topic-cluster
                              cosine similarity at dispatch time.
    growth_score   (0.0-1.0): exploration signal. 1.0 for never-watched
                              channels (slice 3b candidates); for
                              previously-watched channels, the inverse
                              of the watch-count fraction.
    slop_score     (0.0-1.0): heuristic on the video title. 0.8 if
                              title matches clickbait patterns
                              ("won't believe" / "shocking" / "insane"
                              / "gone wrong" / "you'll never"); 0.1
                              otherwise. The composer LLM can override
                              based on its own judgment.

  Filters to candidates discovered in the last 2 days so the LLM sees
  a fresh pool but with enough volume for the priority sort to matter.
  Slice 3b adds ~80 rows per daily 0 4 * * * fire (8 clusters × 10
  results each); slice 1.5 adds ~600 per day (top 40 channels × 15
  entries × 4 RSS runs); slice 7 (2026-05-17) adds the Archive.org
  source - ~40 rows per daily 0 4 * * * fire from the
  public-domain film/lecture pool. Archive.org rows are all scored
  interest_score=0.0 + growth_score=1.0 by this feeder (no YouTube
  watch_history match → full exploration); the composer's
  apply_topic_scoring hook then re-scores interest_score by
  topic-cosine-similarity against the user's snapshot at dispatch
  time, so archive.org items still surface in the user's topical
  clusters when relevant.

  CRITICAL - uses `| join type=left` (NOT inner). Without it, slice 3b
  candidates from never-watched channels would be dropped by the inner
  join because their channel_id has no watch_history match. The
  breadth piece would be invisible to the LLM. Caught 2026-05-17
  during the slice 3a production-readiness audit BEFORE the bug
  manifested in a live composer fire.

  Top 100 by interest_score (preliminary); the dispatcher hook then
  re-scores by topic similarity and the composer picks ~10-20 from
  the resulting pool plus some exploration items based on the
  growth_dial setting. See docs/lang/21_curator_speaktube.md.
query: |-
  index="indexes/IMMUTABLE/curator_candidates/*"
  | where source="youtube_rss"
  | where discovered_at_epoch >= relative_time("-2d")
  | join type=left channel_id [search index="indexes/IMMUTABLE/curator_takeout/watch_history/*" | where channel_id != "" | stats count as watch_count by channel_id]
  | eventstats max(watch_count) as max_watch
  | eval interest_score=if_(isnull(watch_count), 0.0, round(watch_count / max_watch, 3))
  | eval growth_score=if_(isnull(watch_count), 1.0, round(1.0 - (watch_count / max_watch), 3))
  | eval slop_score=if_(match(lower(title), "won.?t believe|shocking|insane|gone wrong|you.?ll never"), 0.8, 0.1)
  | sort -interest_score
  | head 100
  | append [search index="indexes/IMMUTABLE/curator_candidates/*" | where match(source, "^topic_search:") | where discovered_at_epoch >= relative_time("-2d") | eval interest_score=0.0 | eval growth_score=1.0 | eval slop_score=if_(match(lower(title), "won.?t believe|shocking|insane|gone wrong|you.?ll never"), 0.8, 0.1) | eval watch_count=0 | sort -_epoch | head 80]
  | append [search index="indexes/IMMUTABLE/curator_candidates/*" | where source="archive_org" | where discovered_at_epoch >= relative_time("-2d") | eval interest_score=0.0 | eval growth_score=1.0 | eval slop_score=if_(match(lower(title), "won.?t believe|shocking|insane|gone wrong|you.?ll never"), 0.8, 0.1) | eval watch_count=0 | sort -_epoch | head 40]
  | table video_external_id, video_url, title, channel_name, channel_id, watch_count, interest_score, growth_score, slop_score, _epoch, published_iso, thumbnail_url, source
  | dedup video_external_id
