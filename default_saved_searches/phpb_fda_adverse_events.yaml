name: phpb_fda_adverse_events
description: |
  Alert-group feed: drug-level FDA adverse-event signals from the past 30
  days, ranked by serious-event volume and death-pct severity. Reuses the
  existing indexes/fda/adverse_events parquet emitted by fda_adverse_events.
  Filtered to MODERATE+ volume and ELEVATED+ severity so the brief sees
  drugs with material safety signals (precursors to label changes, black-
  box warnings, recalls). Powers the Public Health & Pharma Catalyst
  Brief's safety-signal block.
query: |-
  index="indexes/fda/adverse_events/*.parquet"
  | sort -_epoch
  | dedup drug_name
  | where volume_tier IN ("MODERATE","HIGH","VERY_HIGH")
  | where severity IN ("ELEVATED","HIGH","CRITICAL")
  | sort -severity, -serious_event_count
  | table drug_name, serious_event_count, death_report_count, death_pct, volume_tier, severity, report_window_days
  | head 20
cron_schedule: 0 3 * * mon-fri
lookback: -36h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-25T00:00:00"
updated_at: "2026-04-25T00:00:00"
