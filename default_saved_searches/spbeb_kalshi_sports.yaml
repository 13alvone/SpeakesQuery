name: spbeb_kalshi_sports
description: |
  Alert-group feed: Kalshi sports-related contracts (NFL, NBA, MLB, NHL,
  UFC, MLS, championships, MVP, etc.). Reuses indexes/kalshi_contracts
  parquet emitted by kalshi_contract_scanner, filtered by category /
  title regex match. Capped to contracts closing within 14 days so the
  brief surfaces near-term betting decisions, not season-long futures.
  Powers the Sports Betting Edge Brief's prediction-market block -
  cross-reference vs sportsbook odds for prediction-market arbitrage.
query: |-
  index="indexes/kalshi_contracts/*.parquet"
  | sort -_epoch
  | dedup market_ticker
  | eval is_sports = if_(match(category, "(?i)sport"), 1, if_(match(market_title, "(?i)\\b(NFL|NBA|MLB|NHL|UFC|MLS|MMA|F1|NASCAR|PGA|ATP|WTA|Super Bowl|World Series|Stanley Cup|World Cup|Champions League|Premier League|playoff|finals|championship|MVP|home run|touchdown|knockout)\\b"), 1, 0))
  | where is_sports = 1
  | where days_to_close > 0
  | where days_to_close <= 14
  | sort -volume
  | table event_title, market_title, category, yes_price, implied_prob_yes, volume, open_interest, days_to_close
  | head 25
cron_schedule: 0 13,15 * * *
lookback: -48h
trigger: once
email_address: noreply@speakesquery.local
email_body: ""
mv_truncate_limit: 3
attach_csv: "no"
token_validation_days: 30
send_email: "no"
analyzer_prompt: ""
analyzer_filter_enabled: false
analyzer_filter_question: ""
disabled: false
created_at: "2026-04-24T00:00:00"
updated_at: "2026-04-24T00:00:00"
