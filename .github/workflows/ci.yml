name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full run including the Playwright browser tier.
    # (GitHub cron is UTC; day-of-week not used anywhere here, so the
    # APScheduler 0=Mon footgun cannot apply.)
    - cron: '30 6 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install flake8
      # .flake8 owns the exclude list (generated ANTLR code). Never pass
      # --exclude on the CLI - it OVERRIDES the config and lints
      # lexers/antlr4_active/.
      - run: flake8

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      # CPU-only torch first so sentence-transformers does not drag in
      # the multi-GB CUDA build (same trick as the Docker image).
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pip install pytest playwright
      # Default markers already exclude smoke + live_integration
      # (network/secrets tiers). Browser tests run in the nightly job.
      - run: pytest -q --ignore=tests/test_ui.py --ignore=tests/test_ui_crud.py

  ui-tests:
    # Playwright tier: nightly + on-demand only, to keep push feedback fast.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pip install pytest playwright
      - run: playwright install chromium --with-deps
      - run: pytest -q tests/test_ui.py tests/test_ui_crud.py
