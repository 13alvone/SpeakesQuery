name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full run including the Playwright browser tier.
    # (GitHub cron is UTC; day-of-week not used anywhere here, so the
    # APScheduler 0=Mon footgun cannot apply.)
    - cron: '30 6 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install flake8
      # .flake8 owns the exclude list (generated ANTLR code). Never pass
      # --exclude on the CLI - it OVERRIDES the config and lints
      # lexers/antlr4_active/.
      - run: flake8

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      # CPU-only torch first so sentence-transformers does not drag in
      # the multi-GB CUDA build (same trick as the Docker image).
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      # pytest pinned so CI cannot silently jump a major version ahead
      # of local dev (bare "pip install pytest" resolved 9.1.1 while
      # local venvs ran 8.4.2 - the suite passes on both today, but an
      # unpinned resolve makes every future pytest release a surprise
      # variable in CI triage). Bump deliberately, run the suite, then
      # update this pin and the local venv together.
      - run: pip install pytest==9.1.1 playwright
      # Explicit -m OVERRIDES the pytest.ini addopts marker expression,
      # so smoke + live_integration (network/secrets tiers) must be
      # re-excluded here. "not browser" keeps every Playwright-fixture
      # test out of this job (conftest auto-applies the marker from
      # fixture usage; no Chromium is installed here). The first CI run
      # proved a file-level ignore list rots: browser tests outside
      # tests/test_ui*.py (test_redesign_2026_04_26.py) errored at
      # browser launch on 2026-07-12.
      - run: pytest -q -m "not smoke and not live_integration and not browser"

  ui-tests:
    # Playwright tier: nightly + on-demand only, to keep push feedback fast.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      # Same pin as the tests job above - keep the two in lockstep.
      - run: pip install pytest==9.1.1 playwright
      - run: playwright install chromium --with-deps
      # Marker-selected, not file-selected: picks up every test whose
      # fixture closure includes browser_instance, wherever it lives.
      - run: pytest -q -m browser
